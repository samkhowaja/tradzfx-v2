worker_processes auto;

# Nginx temp directories (Windows-compatible)
pid C:/tradzfx-v2/temp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    # Increase hash bucket size for longer server_names (e.g., v1.tradzfx.com)
    server_names_hash_bucket_size 64;

    client_body_temp_path C:/tradzfx-v2/temp/client_body_temp;
    proxy_temp_path C:/tradzfx-v2/temp/proxy_temp;
    fastcgi_temp_path C:/tradzfx-v2/temp/fastcgi_temp;
    uwsgi_temp_path C:/tradzfx-v2/temp/uwsgi_temp;
    scgi_temp_path C:/tradzfx-v2/temp/scgi_temp;

    # Upstream with health checks and failover
    # V2 is the single app. All traffic routes to port 3003.
    upstream app_backend {
        server 127.0.0.1:3003 max_fails=3 fail_timeout=5s;
        keepalive 32;
    }

    # Ingestion backend — standalone server (port 3004)
    # Survives Next.js restarts and persists 1m bars directly to PostgreSQL.
    upstream ingestion_backend {
        server 127.0.0.1:3004 max_fails=3 fail_timeout=5s;
        keepalive 32;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # ── tradzfx.com: V2 root, V1 on v1.tradzfx.com ─────────────────────────
    upstream v2_backend {
        server 127.0.0.1:3003 max_fails=3 fail_timeout=5s;
        keepalive 32;
    }

    # Legacy V1 upstream kept for config compatibility; both subdomains now serve V2.
    upstream v1_backend {
        server 127.0.0.1:3003 max_fails=3 fail_timeout=5s;
        keepalive 32;
    }

    server {
        listen 80;
        server_name tradzfx.com www.tradzfx.com;
        client_max_body_size 50M;

        # V2 static assets — cache forever
        location /_next/static/ {
            proxy_pass http://v2_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # EA bar ingestion + heartbeat → standalone server (port 3004), so a
        # web restart can never drop bars even when the EA posts to this host.
        # Exact matches take priority over "location /" regardless of order.
        location = /api/ingest/mt5/bars {
            proxy_pass http://ingestion_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Connection "";
            proxy_connect_timeout 15s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            proxy_next_upstream off;
        }

        location = /api/ingest {
            proxy_pass http://ingestion_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Connection "";
            proxy_connect_timeout 15s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            proxy_next_upstream off;
        }

        location = /api/ingest/heartbeat {
            proxy_pass http://ingestion_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Connection "";
            proxy_connect_timeout 15s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # V2 everything else
        location / {
            proxy_pass http://v2_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 30s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
            proxy_buffering off;
            proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
            proxy_next_upstream_timeout 10s;

            # Do not let Next.js's 1-year s-maxage cause stale HTML at Cloudflare/browsers.
            proxy_hide_header Cache-Control;
            add_header Cache-Control "public, max-age=0, must-revalidate" always;
        }
    }

    server {
        listen 80;
        server_name v1.tradzfx.com;
        client_max_body_size 50M;

        # EA bar ingestion + heartbeat → standalone server (port 3004).
        # Exact matches take priority over "location /" regardless of order.
        location = /api/ingest/mt5/bars {
            proxy_pass http://ingestion_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Connection "";
            proxy_connect_timeout 15s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            proxy_next_upstream off;
        }

        location = /api/ingest {
            proxy_pass http://ingestion_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Connection "";
            proxy_connect_timeout 15s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            proxy_next_upstream off;
        }

        location = /api/ingest/heartbeat {
            proxy_pass http://ingestion_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Connection "";
            proxy_connect_timeout 15s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        location / {
            proxy_pass http://v1_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 30s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
            proxy_buffering off;

            # Prevent CDNs/browsers from caching stale HTML.
            proxy_hide_header Cache-Control;
            add_header Cache-Control "public, max-age=0, must-revalidate" always;
        }

        # Preserve V1 static asset caching
        location /_next/static/ {
            proxy_pass http://v1_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
    }

    # ── Port 3000: legacy MT5 EA compatibility ─────────────────────────────
    # The MT5 EA default InpServerUrl is http://127.0.0.1:3000 (direct connect,
    # bypasses nginx). We serve port 3000 here so existing EA configs continue
    # to work without modification. Routing is identical to port 80.
    server {
        listen 3000;
        server_name _;
        client_max_body_size 50M;

        # n8n management UI mounted at /management
        location = /management {
            proxy_pass http://127.0.0.1:5678/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            proxy_buffering off;

            sub_filter_once off;
            sub_filter 'href="/' 'href="/management/';
            sub_filter 'src="/' 'src="/management/';
        }

        location /management/ {
            rewrite ^/management/?(.*)$ /$1 break;
            proxy_pass http://127.0.0.1:5678/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            proxy_buffering off;

            # Rewrite absolute asset URLs in HTML to stay under /management.
            sub_filter_once off;
            sub_filter 'href="/' 'href="/management/';
            sub_filter 'src="/' 'src="/management/';
        }

        # Raw 1m bar ingestion → standalone server (survives main app restarts)
        location = /api/ingest/mt5/bars {
            proxy_pass http://ingestion_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Connection "";
            proxy_connect_timeout 15s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            # Do NOT retry on error — EA handles retries itself; retrying here causes duplicates
            proxy_next_upstream off;
        }

        # V1/V2 bar ingestion also goes to the standalone server
        location = /api/ingest {
            proxy_pass http://ingestion_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Connection "";
            proxy_connect_timeout 15s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            proxy_next_upstream off;
        }

        # EA heartbeat is persisted by the standalone server
        location = /api/ingest/heartbeat {
            proxy_pass http://ingestion_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Connection "";
            proxy_connect_timeout 15s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        location / {
            proxy_pass http://app_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 30s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
            proxy_buffering off;
        }
    }

    server {
        listen 80 default_server;
        server_name tradzfx.duckdns.org _;
        client_max_body_size 50M;

        # n8n management UI mounted at /management
        location = /management {
            proxy_pass http://127.0.0.1:5678/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            proxy_buffering off;

            sub_filter_once off;
            sub_filter 'href="/' 'href="/management/';
            sub_filter 'src="/' 'src="/management/';
        }

        location /management/ {
            rewrite ^/management/?(.*)$ /$1 break;
            proxy_pass http://127.0.0.1:5678/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            proxy_buffering off;

            # Rewrite absolute asset URLs in HTML to stay under /management.
            sub_filter_once off;
            sub_filter 'href="/' 'href="/management/';
            sub_filter 'src="/' 'src="/management/';
        }

        # Error pages for UI only — NOT for API routes
        error_page 502 503 504 /loading.html;

        # Loading page while app starts
        location = /loading.html {
            default_type text/html;
            return 200 '
<!DOCTYPE html>
<html>
<head>
    <title>tradzfx - Starting...</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #111827; color: #e5e7eb; margin: 0; padding: 0; display: flex; align-items: center; justify-content: center; height: 100vh; }
        .loading { text-align: center; }
        .spinner { border: 4px solid #374151; border-top: 4px solid #3b82f6; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 0 auto 20px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        h1 { margin: 0; font-size: 24px; }
        p { margin: 10px 0 0 0; color: #9ca3af; }
    </style>
</head>
<body>
    <div class="loading">
        <div class="spinner"></div>
        <h1>tradzfx</h1>
        <p>Updating and restarting server...</p>
        <p style="font-size: 12px; margin-top: 20px; color: #6b7280;">Please refresh in a moment</p>
    </div>
    <script>
        setTimeout(() => location.reload(), 3000);
    </script>
</body>
</html>
            ';
        }

        # Raw 1m bar ingestion → standalone server (survives main app restarts).
        # Exact match takes priority over the prefix block below.
        location = /api/ingest/mt5/bars {
            proxy_pass http://ingestion_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Connection "";
            proxy_connect_timeout 15s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            # Do NOT retry — EA handles retries itself
            proxy_next_upstream off;
        }

        # V1/V2 bar ingestion also goes to the standalone server
        location = /api/ingest {
            proxy_pass http://ingestion_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Connection "";
            proxy_connect_timeout 15s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            proxy_next_upstream off;
        }

        # EA heartbeat is persisted by the standalone server
        location = /api/ingest/heartbeat {
            proxy_pass http://ingestion_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Connection "";
            proxy_connect_timeout 15s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # All other MT5 routes (config, status, keys, signals) → main app
        location /api/ingest/mt5/ {
            proxy_pass http://app_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_connect_timeout 30s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
        }

        location /api/mt5/ {
            proxy_pass http://app_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_connect_timeout 30s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
        }

        # Static assets — content-hashed, cache forever
        location /_next/static/ {
            proxy_pass http://app_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_buffering off;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        location / {
            proxy_pass http://app_backend;
            proxy_http_version 1.1;
            
            # WebSocket support
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            
            # Standard headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Prevent browser from caching HTML pages — forces fresh chunk refs after deploy
            proxy_hide_header Cache-Control;
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
            
            # Timeouts - allow longer during startup
            proxy_connect_timeout 30s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
            
            # Connection reuse
            proxy_set_header Connection "";
            
            # Buffering off for real-time features
            proxy_buffering off;
            
            # Retry on failure (e.g., app restarting)
            proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
            proxy_next_upstream_timeout 10s;
        }

        # Health check endpoint (optional)
        location /health {
            proxy_pass http://app_backend;
            access_log off;
        }
    }
}
