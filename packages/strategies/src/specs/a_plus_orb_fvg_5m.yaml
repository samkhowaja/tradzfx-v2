id: a_plus_orb_fvg_5m
familyId: a_plus_orb_fvg
setupFamily: fvg_continuation
active: true
name: "A+ ORB FVG 5m"
version: "1.0.0"
description: >
  Transcript-derived A+ strategy: mark the 9:30-9:45 New York 15m opening
  candle, then from 9:45 to 12:00 New York wait for a 5m fair value gap that
  breaks fully outside that range. Place a limit order at the FVG midpoint,
  stop at candle 1 of the FVG, target fixed 2R. This spec uses the current
  data window's daylight UTC mapping: 13:45-16:00 UTC.

filters:
  symbols: [AUDUSD, EURUSD, GBPUSD, NZDUSD, USDCAD, USDCHF, USDJPY, USDSEK, XAUUSD]
  sessions: [NY, OVERLAP]
  timeWindows:
    - { utcStart: "13:45", utcEnd: "16:00" }

setup:
  - id: local_bias_anchor
    feature: features_bias
    tf: 5m
    predicate: "direction IN ('bullish', 'bearish')"
    required: true

entry:
  - id: opening_break_fvg
    feature: features_zone
    tf: 5m
    predicate: "zone_kind = 'fvg' AND direction IN ('bullish', 'bearish')"
    required: true
    groupBy: [direction]

signalSource: fvg
signalSourceConfig:
  minFvgWidthPips: 2

entryConfig:
  type: limit

risk:
  sl: fvg_c1_stop
  tp: "sl * 2.0"
  minRR: 2.0
  timeoutBars: 36
  maxFillBars: 12
  minSlDistancePips: 1.5

gates:
  - id: portfolio_heat
    name: portfolioHeat
    params:
      maxConcurrentPerSymbol: 1
      maxConcurrentTotal: 9

  - id: direction_alignment_gate
    name: directionAlignment
    params:
      enabled: true
      timeframes: ["1h", "15m"]
      require: majority
      allowNeutral: true

live:
  mode: paper
  lotSize: 0.01
  riskPerTradePct: 1.0
  accountBalance: 10000
  accountCurrency: USD
  signalTtlMinutes: 60
  maxSpreadPips: 3.0
  maxSlippagePoints: 20
  entryZonePips: 0
  maxPositionsPerSymbol: 1
  maxPositionsTotal: 9
  cooldownMinutes: 1440
  structureFreshnessMinutes: 0

notes:
  - "Opening range is derived directly from candles_15m at 13:30 UTC because features_opening_range currently defines ny at 16:00 UTC."
  - "The video says EST, but the available 2026-04 to 2026-07 data is in US daylight time, so NY 9:45-12:00 is 13:45-16:00 UTC."
  - "Uses first qualifying 5m FVG per symbol/day to avoid duplicate signals from repeated PIT anchor rows."
