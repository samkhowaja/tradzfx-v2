id: keylevel_bounce_v1_4r
familyId: keylevel_bounce
active: true
name: Key-Level Bounce V1 (4R target)
version: 2.0.0
description: |
  50-pip SL targeting 200 pips (4R) from demand/supply key levels. v2: Progressive steps replaces flat setup[].
  Direction cross-references removed — chain guarantees alignment.
overrides:
  steps:
    - id: trend_bias
      feature: features_bias
      tf: 1h
      predicate: direction != 'neutral'
      required: true

    - id: directional_zone
      feature: features_pricing
      tf: 15m
      predicate: position IN ('discount', 'deep_discount', 'equilibrium', 'premium', 'deep_premium')
      required: true
      dependsOn: [trend_bias]
      autoAlignDirection: false
      ttlMinutes: 30

    - id: htf_zone
      feature: features_zone
      tf: 15m
      predicate: zone_kind IN ('demand', 'supply') AND fill_pct < 0.95
      required: true
      dependsOn: [directional_zone]
      ttlMinutes: 240

  entry:
    - id: structure_break
      feature: features_structure
      tf: 15m
      predicate: event_type IN ('bos', 'mss')
      required: true
    - id: zone_retest
      feature: features_zone
      tf: 15m
      predicate: zone_kind IN ('demand', 'supply') AND fill_pct < 0.95
      required: true
  risk:
    tp: sl * 4.0
    minRR: 4
    timeoutBars: 480
    maxFillBars: 120
