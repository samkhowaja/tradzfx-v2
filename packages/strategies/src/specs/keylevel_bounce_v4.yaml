id: keylevel_bounce_v4
familyId: keylevel_bounce
active: true
dxyDependency: not_required
name: Key-Level Bounce V4
version: 5.0.0
description: >
  Adds a 4h trend alignment filter so we only buy key levels in a bullish higher timeframe and only sell in a bearish
  higher timeframe.
overrides:
  steps:
    - id: trend_bias
      feature: features_bias
      tf: 1h
      predicate: direction != 'neutral'
      required: true

    - id: htf_bias
      feature: features_bias
      tf: 4h
      predicate: direction != 'neutral'
      required: true
      dependsOn: [trend_bias]
      ttlMinutes: 480

    - id: directional_zone
      feature: features_pricing
      tf: 15m
      predicate: position IN ('discount', 'deep_discount', 'equilibrium', 'premium', 'deep_premium')
      required: true
      dependsOn: [htf_bias]
      autoAlignDirection: false
      ttlMinutes: 30

    - id: htf_zone
      feature: features_zone
      tf: 15m
      predicate: zone_kind IN ('demand', 'supply') AND fill_pct < 0.95
      required: true
      dependsOn: [directional_zone]
      ttlMinutes: 240

  risk:
    tp: sl * 4.0
    minRR: 4
    timeoutBars: 480
    maxFillBars: 120
