id: keylevel_bounce_v4
familyId: keylevel_bounce
active: true
name: Key-Level Bounce V4
version: 4.0.0
description: >
  Adds a 4h trend alignment filter so we only buy key levels in a bullish higher timeframe and only sell in a bearish
  higher timeframe.
overrides:
  setup:
    - id: trend_bias
      feature: features_bias
      tf: 1h
      predicate: direction != 'neutral'
      required: true
    - id: htf_bias
      feature: features_bias
      tf: 4h
      predicate: direction = features_bias.direction
      required: true
    - id: directional_zone
      feature: features_pricing
      tf: 15m
      predicate: |
        (features_bias.direction = 'bullish' AND position IN ('discount', 'deep_discount', 'equilibrium'))
        OR
        (features_bias.direction = 'bearish' AND position IN ('premium', 'deep_premium', 'equilibrium'))
      required: true
    - id: htf_zone
      feature: features_zone
      tf: 15m
      predicate: zone_kind IN ('demand', 'supply') AND fill_pct < 0.95
      required: true
  risk:
    tp: sl * 4.0
    minRR: 4
    timeoutBars: 480
    maxFillBars: 120
