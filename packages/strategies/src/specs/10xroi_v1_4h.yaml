id: 10xroi_v1_4h
familyId: 10xroi
active: true
name: "10XROI V1 — 4h"
version: "1.0.0"
description: "10XROI on 4h TF. 4h push-pull + daily bias + 4h candle confirmation. SL = ATR(4h)*1.0, 10R."
overrides:
  setup:
    - id: push_pull
      feature: features_push_pull
      tf: 4h
      predicate: "push_count >= 1"
      required: true

  entry:
    - id: candle_confirm
      feature: features_candle_pattern
      tf: 4h
      predicate: "pattern_name IN ('pin_bar', 'engulfing_bull', 'engulfing_bear', 'hammer', 'hanging_man') AND confidence >= 0.5"
      required: true
      lookbackBars: 6

  risk:
    sl: "atr(4h) * 1.0"
    tp: "sl * 10.0"
    minRR: 5.0
    timeoutBars: 60
    maxFillBars: 30
