id: keylevel_bounce_v8b_zone_tp
active: true
name: "Key-Level Bounce V8b (zone TP)"
version: "8.1.0"
description: >
  Short-only key-level bounce restricted to the best-performing UTC hours.
  TP is set at the nearest opposing demand-zone bottom (opposing_zone_profit),
  pulled 2 pips inside the wick. SL stays fixed at 50 pips.

filters:
  symbols: [XAUUSD]
  sessions: [OVERLAP, NY]

setup:
  - id: trend_bias
    feature: features_bias
    tf: 1h
    predicate: "direction = 'bearish'"
    required: true

  - id: directional_zone
    feature: features_pricing
    tf: 15m
    predicate: "position IN ('premium', 'deep_premium', 'equilibrium')"
    required: true

  - id: htf_zone
    feature: features_zone
    tf: 15m
    predicate: "zone_kind IN ('demand', 'supply') AND fill_pct < 0.95"
    required: true

entry:
  - id: structure_break
    feature: features_structure
    tf: 15m
    predicate: "event_type IN ('bos', 'mss') AND direction = 'bearish'"
    required: true

  - id: zone_retest
    feature: features_zone
    tf: 15m
    predicate: "zone_kind IN ('demand', 'supply') AND fill_pct < 0.95"
    required: true

risk:
  sl: "0.50"
  tp: "opposing_zone_profit"
  tpOffsetPips: -2
  minRR: 1.5
  timeoutBars: 480
  maxFillBars: 120

gates:
  - id: session_gate
    name: session
    params:
      allowed: [OVERLAP, NY]
      windows:
        - "12:00-12:59"
        - "14:00-14:59"
        - "16:00-16:59"
        - "17:00-17:59"
        - "19:00-19:59"
        - "20:00-20:59"

  - id: portfolio_heat
    name: portfolioHeat
    params:
      maxConcurrentPerSymbol: 1
      maxConcurrentTotal: 3

live:
  mode: paper
  structureFreshnessMinutes: 120
  lotSize: 0.01
  riskPerTradePct: 1.0
  accountBalance: 10000
  accountCurrency: USD
  signalTtlMinutes: 15
  maxSpreadPips: 3.0
  maxSlippagePoints: 20
  entryZonePips: null
