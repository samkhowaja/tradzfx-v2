id: waqar_v2_15m_loose
active: true
name: "Waqar Asim Scalp V2 (15m-only) — Loose"
version: "2.1.0"
description: >
  15m-only variant with relaxed alignment.
  Accepts equilibrium premium/discount and makes the 15m zone retest optional,
  so it can trade pairs that don't print perfect 15m discount/premium setups.

filters:
  symbols: [EURUSD, GBPUSD, AUDUSD, NZDUSD, USDCAD, USDCHF, USDJPY, XAUUSD]
  sessions: [LONDON, OVERLAP]

setup:
  - id: htf_zone
    feature: features_zone
    tf: 15m
    predicate: "zone_kind IN ('demand', 'supply')"
    required: true

  - id: trend_bias
    feature: features_bias
    tf: 15m
    predicate: "direction != 'neutral'"
    required: true

  - id: directional_zone
    feature: features_pricing
    tf: 15m
    predicate: |
      (features_bias.direction = 'bullish' AND position IN ('discount', 'deep_discount', 'equilibrium'))
      OR
      (features_bias.direction = 'bearish' AND position IN ('premium', 'deep_premium', 'equilibrium'))
    required: true

entry:
  - id: structure_break
    feature: features_structure
    tf: 15m
    predicate: "event_type IN ('bos', 'mss') AND direction = features_bias.direction"
    required: true

  - id: zone_retest
    feature: features_zone
    tf: 15m
    predicate: "zone_kind IN ('demand', 'supply') AND fill_pct < 0.8 AND tapped = false"
    required: false
    weight: 5

risk:
  sl: "atr(15m) * 1.2"
  tp: "sl * 3.0"
  minRR: 3.0
  timeoutBars: 180
  maxFillBars: 45

gates:
  - id: volatility_gate
    name: volatility
    params:
      maxAtr5: 2.0

  - id: session_gate
    name: session
    params:
      allowed: [LONDON, OVERLAP]

live:
  mode: paper
  lotSize: 0.01
  riskPerTradePct: 1.0
  accountBalance: 10000
  accountCurrency: USD
  signalTtlMinutes: 15
  maxSpreadPips: 3.0
  maxSlippagePoints: 20
  entryZonePips: null
  maxPositionsPerSymbol: 1
  maxPositionsTotal: 6
  cooldownMinutes: 30
