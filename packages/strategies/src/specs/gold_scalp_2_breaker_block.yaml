id: gold_scalp_2_breaker_block
familyId: gold_scalp_2_breaker_block
active: true
dxyDependency: not_required
experimental: true
name: "Gold Scalp 2 — Supply/Demand + Breaker Block"
version: "1.0.0"
description: >
  Video strategy 2: HTF (1h) uptrend confirmed by 2+ consecutive bullish BOS.
  Identify demand zone. LTF (5m) price retraces to demand zone, look for MSS
  or CHoCH. Entry at breaker block inside the demand zone. SL below swing low,
  TP nearest HTF buyside liquidity.

filters:
  symbols: [ XAUUSD ]
  sessions: [ LONDON, OVERLAP, NY ]
  timeWindows:
    - { utcStart: "07:00", utcEnd: "11:00" }
    - { utcStart: "13:00", utcEnd: "16:30" }

setup:
  # HTF (1h) trend confirmation: bullish bias
  - id: htf_bias
    feature: features_bias
    tf: 1h
    predicate: "direction = 'bullish'"
    required: true
    weight: 10

  # HTF structural uptrend: 2+ consecutive bullish BOS detected by structure
  - id: htf_bos_trend
    feature: features_structure
    tf: 1h
    predicate: "event_type = 'bos' AND direction = 'bullish'"
    required: false
    weight: 9
    lookbackBars: 24

  # Fresh demand zone on HTF
  - id: htf_demand_zone
    feature: features_zone
    tf: 1h
    predicate: "zone_kind = 'demand' AND fill_pct < 0.8"
    required: false
    weight: 9
    lookbackBars: 240

  # Pricing in discount/premium relative to HTF structure
  - id: pricing_htf
    feature: features_pricing
    tf: 1h
    predicate: "position IN ('discount', 'equilibrium')"
    required: false
    weight: 5

entry:
  # LTF (5m) MSS/CHoCH within demand zone — retail trapped, smart money entering
  - id: ltf_mss_reversal
    feature: features_structure
    tf: 5m
    predicate: "event_type IN ('bos', 'mss') AND direction = 'bearish'"
    required: true
    weight: 8

  # LTF bullish structure break confirming reversal
  - id: ltf_bos_entry
    feature: features_structure
    tf: 5m
    predicate: "event_type IN ('bos', 'mss') AND direction = 'bullish'"
    required: true
    weight: 10

  # Breaker block inside zone — order block from the MSS leg
  - id: breaker_block
    feature: features_order_block
    tf: 5m
    predicate: "ob_kind = 'bullish' AND degree IN ('major', 'swing')"
    required: false
    weight: 9

  # iFVG in the breaker leg adds confluence
  - id: ltf_ifvg
    feature: features_ifvg
    tf: 5m
    predicate: "direction = 'bullish'"
    required: false
    weight: 6

entryConfig:
  type: market
  zonePips: null

risk:
  sl: "atr(5m) * 1.5"
  tp: "sl * 2.0"
  minRR: 2.0
  timeoutBars: 180
  maxFillBars: 45

signalSource: generic

gates:
  - id: session_gate
    name: session
    params:
      allowed: [ LONDON, OVERLAP, NY ]

  - id: spread_gate
    name: spread
    params:
      maxSpreadPips: 5.0

  - id: volatility_gate
    name: volatility
    params:
      maxAtrPercentile: 0.95
      maxAtr5Pips: 30.0

  - id: portfolio_heat
    name: portfolioHeat
    params:
      maxConcurrentPerSymbol: 1
      maxConcurrentTotal: 3

  - id: rate_limit
    name: rateLimit
    params:
      maxSignalsPerHour: 2
      maxSignalsPerDay: 5

live:
  mode: paper
  lotSize: 0.01
  riskPerTradePct: 1.0
  accountBalance: 10000
  accountCurrency: USD
  signalTtlMinutes: 15
  maxSpreadPips: 5.0
  maxSlippagePoints: 30
  maxPositionsPerSymbol: 1
  maxPositionsTotal: 3
  cooldownMinutes: 30
  structureFreshnessMinutes: 30
