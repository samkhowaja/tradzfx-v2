id: smart_risk_ob_ifvg_1m
familyId: smart_risk_ob_ifvg_1m
active: true
name: "Smart Risk Scalp 1 — OB + iFVG"
version: "1.0.1"
description: >
  Video strategy 1 proxy: higher-timeframe fresh order block / zone context,
  then a lower-timeframe inverse FVG aligned with the bias for entry.

filters:
  symbols: [ XAUUSD ]
  sessions: [ LONDON, OVERLAP, NY ]
  timeWindows:
    - { utcStart: "08:00", utcEnd: "11:30" }
    - { utcStart: "13:30", utcEnd: "16:30" }

setup:
  - id: bias
    feature: features_direction_state
    tf: 15m
    predicate: "direction != 'neutral'"
    required: true
    weight: 8

  - id: htf_zone
    feature: features_zone
    tf: 15m
    predicate: "zone_kind IN ('demand', 'supply', 'fvg') AND fill_pct < 0.8 AND
      is_fresh = true"
    required: true
    weight: 8

  - id: htf_ob
    feature: features_order_block
    tf: 15m
    predicate: "ob_kind = features_direction_state.direction"
    required: false
    weight: 5

  - id: htf_sweep
    feature: features_sweep
    tf: 15m
    predicate: "direction = features_direction_state.direction"
    required: false
    weight: 3

  - id: pricing_filter
    feature: features_pricing
    tf: 5m
    predicate: "position IN ('premium', 'deep_premium', 'equilibrium', 'discount',
      'deep_discount')"
    required: true
    weight: 1

entry:
  - id: ltf_ifvg
    feature: features_ifvg
    tf: 5m
    predicate: "direction = features_direction_state.direction AND fill_pct >= 0.5 AND is_fresh = true AND age_bars < 10"
    required: true
    weight: 10

  - id: ltf_structure
    feature: features_structure
    tf: 5m
    predicate: "event_type IN ('bos', 'mss') AND direction = features_direction_state.direction"
    required: false
    weight: 5

entryConfig:
  type: market
  zonePips: null

risk:
  sl: "atr(5m) * 1.5"
  tp: "sl * 2.0"
  minRR: 2.0
  timeoutBars: 120
  maxFillBars: 30

gates:
  - id: session_gate
    name: session
    params:
      allowed: [ LONDON, OVERLAP, NY ]

  - id: spread_gate
    name: spread
    params:
      maxSpreadPips: 5.0

  - id: volatility_gate
    name: volatility
    params:
      # P0-B2 (V3 BUG-3.1): asset-class-safe percentile policy. The 30-pip flat cap
      # blocked ~95% of XAUUSD bars (median ~50p); the percentile cap (own p95)
      # passes normal bars and blocks only the top-5% extreme vol. maxAtr5Pips is
      # an emergency fallback only. NOTE: expected to un-throttle smart_risk fast
      # (research edge ~485 candidates) — fast 90d count will rise above 20.
      maxAtrPercentile: 0.95
      sessionMaxAtrPercentile:
        NY: 0.95
      maxAtr5Pips: 500

  - id: portfolio_heat
    name: portfolioHeat
    params:
      maxConcurrentPerSymbol: 1
      maxConcurrentTotal: 3

live:
  mode: paper
  lotSize: 0.01
  riskPerTradePct: 1.0
  accountBalance: 10000
  accountCurrency: USD
  signalTtlMinutes: 15
  maxSpreadPips: 5.0
  maxSlippagePoints: 30
  entryZonePips: null
  maxPositionsPerSymbol: 1
  maxPositionsTotal: 3
  cooldownMinutes: 30
  structureFreshnessMinutes: 60
