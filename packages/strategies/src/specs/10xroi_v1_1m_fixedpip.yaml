id: 10xroi_v1_1m_fixedpip
familyId: 10xroi
active: true
name: "10XROI V1 — 1m fixed pip"
version: "1.0.0"
description: "10XROI on 1m TF. Fixed 25-pip SL, 125-pip TP (5:1). 1m push-pull + daily bias + candle confirmation."
overrides:
  setup:
    - id: push_pull
      feature: features_push_pull
      tf: 1m
      predicate: "push_count >= 1"
      required: true

  entry:
    - id: candle_confirm
      feature: features_candle_pattern
      tf: 1m
      predicate: "pattern_name IN ('pin_bar', 'engulfing_bull', 'engulfing_bear', 'hammer', 'hanging_man') AND confidence >= 0.5"
      required: true
      lookbackBars: 6

  risk:
    sl: "25 pips"
    tp: "125 pips"
    minRR: 4.0
    timeoutBars: 240
    maxFillBars: 30
