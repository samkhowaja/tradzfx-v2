id: waqar_v2_local_agree
familyId: waqar_v2
active: true
name: Waqar Asim Scalp V2 — local bias agreement
version: 2.2.0
description: >
  Same as waqar_v2 but requires the local 15m EMA bias to agree with the HTF bias before taking a trade. This blocks the
  ~50% of cases where HTF and local 15m trends fight each other.
overrides:
  setup:
    - id: htf_zone
      feature: features_zone
      tf: 1h
      predicate: zone_kind IN ('demand', 'supply')
      required: true
    - id: trend_bias
      feature: features_htf_bias
      tf: 15m
      predicate: direction != 'neutral' AND state IN ('READY', 'SOFT_WARN')
      required: true
    - id: local_bias_agreement
      feature: features_bias
      tf: 15m
      predicate: direction = features_htf_bias.direction
      required: true
    - id: directional_zone
      feature: features_pricing
      tf: 4h
      predicate: |
        (features_htf_bias.direction = 'bullish' AND position IN ('discount', 'deep_discount'))
        OR
        (features_htf_bias.direction = 'bearish' AND position IN ('premium', 'deep_premium'))
      required: true
  entry:
    - id: structure_break
      feature: features_structure
      tf: 1m
      predicate: event_type IN ('bos', 'mss') AND direction = features_htf_bias.direction
      required: true
    - id: zone_retest
      feature: features_zone
      tf: 1m
      predicate: zone_kind IN ('demand', 'supply', 'fvg') AND fill_pct < 0.8
      required: true
  gates:
    - id: session_gate
      name: session
      params:
        allowed:
          - LONDON
          - OVERLAP
    - id: portfolio_heat
      name: portfolioHeat
      params:
        maxConcurrentPerSymbol: 2
        maxConcurrentTotal: 6
  live:
    structureFreshnessMinutes: 120
