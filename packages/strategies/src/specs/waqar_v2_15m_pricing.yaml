id: waqar_v2_15m_pricing
familyId: waqar_v2
active: true
name: Waqar Asim Scalp V2 — 15m Pricing
version: 2.1.0
description: >
  Uses the original 1H/1m framework but evaluates premium/discount on the 15m timeframe instead of 4h, so the
  directional-zone filter aligns better with the 15m bias signal.
overrides:
  filters: {}
  setup:
    - id: htf_zone
      feature: features_zone
      tf: 1h
      predicate: zone_kind IN ('demand', 'supply')
      required: true
      weight: 8
    - id: trend_bias
      feature: features_bias
      tf: 15m
      predicate: direction != 'neutral'
      required: true
      weight: 8
    - id: directional_zone
      feature: features_pricing
      tf: 15m
      predicate: |
        (features_bias.direction = 'bullish' AND position IN ('discount', 'deep_discount'))
        OR
        (features_bias.direction = 'bearish' AND position IN ('premium', 'deep_premium'))
      required: true
      weight: 10
  entry:
    - id: structure_break
      feature: features_structure
      tf: 1m
      predicate: event_type IN ('bos', 'mss') AND direction = features_bias.direction
      required: true
      weight: 10
    - id: zone_retest
      feature: features_zone
      tf: 1m
      predicate: zone_kind IN ('demand', 'supply') AND fill_pct < 0.8 AND tapped = false
      required: true
      weight: 10
    - id: displacement_confirm
      feature: features_displacement
      tf: 1m
      predicate: grade IN ('MEDIUM', 'HIGH')
      required: false
      weight: 5
  notes:
    - Directional zone evaluated at 15m instead of 4h
    - No tight time windows — trades full London / overlap
