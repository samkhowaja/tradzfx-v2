id: scarface_5m_orb
familyId: scarface_5m_orb
active: true
name: "Scarface 5m ORB"
version: "1.1.0"
description: >
  Aggressive 5m opening range breakout for equities/forex with candle
  confirmation. Based on Scarface Trades: NY session 9:30–11:00 AM ET
  (13:30–15:00 UTC), minimum 2R target, max 2 attempts per session, stop after
  one win.

filters:
  symbols: [ EURUSD, GBPUSD, AUDUSD, NZDUSD, USDCAD, USDCHF, USDJPY ]
  sessions: [ LONDON, OVERLAP, NY ]
  timeWindows:
    - { utcStart: "13:30", utcEnd: "15:00" }

setup:
  - id: bias
    feature: features_bias
    tf: 5m
    predicate: "direction != 'neutral'"
    required: true

  - id: orb
    feature: features_opening_range
    tf: 5m
    predicate: "1 = 1"
    required: true

  - id: sd_zone
    feature: features_zone
    tf: 1m
    predicate: "zone_kind IN ('demand', 'supply', 'fvg') AND is_fresh = true"
    required: false
    groupBy: [ zone_kind ]

  - id: candle
    feature: features_candle_pattern
    tf: 1m
    predicate: "pattern_name IN ('engulfing_bull', 'engulfing_bear', 'pin_bar') AND
      direction = features_bias.direction"
    required: true
    groupBy: [ pattern_name ]

entry:
  - id: displacement
    feature: features_displacement
    tf: 1m
    predicate: "grade IN ('MEDIUM', 'HIGH') AND consecutive_count >= 2 AND
      sequence_grade IN ('LOW', 'MEDIUM', 'HIGH')"
    required: true

signalSource: orb

risk:
  sl: "atr(1m) * 1.0"
  tp: "sl * 2.0"
  minRR: 2.0
  timeoutBars: 12
  maxFillBars: 3

gates:
  - id: volatility_gate
    name: volatility
    params:
      maxAtr5Pips: 1.5

  - id: spread_gate
    name: spread
    params:
      maxSpreadPips: 2.0

  - id: portfolio_heat
    name: portfolioHeat
    params:
      maxConcurrentPerSymbol: 1
      maxConcurrentTotal: 2

  - id: session_gate
    name: session
    params:
      allowed: [ LONDON, OVERLAP, NY ]

  - id: rate_limit
    name: rateLimit
    params:
      maxSignalsPerHour: 3
      maxSignalsPerDay: 5

  - id: daily_loss
    name: dailyLoss
    params:
      maxLossesPerDay: 2

  - id: daily_win
    name: dailyWin
    params:
      maxWinsPerDay: 1

live:
  mode: paper
  lotSize: 0.01
  riskPerTradePct: 0.75
  accountBalance: 10000
  accountCurrency: USD
  signalTtlMinutes: 15
  maxSpreadPips: 2.0
  maxSlippagePoints: 15
  entryZonePips: null
  maxPositionsPerSymbol: 1
  maxPositionsTotal: 2
  cooldownMinutes: 30
