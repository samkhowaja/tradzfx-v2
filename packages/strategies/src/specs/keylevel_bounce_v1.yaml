id: keylevel_bounce_v1
active: true
name: "Key-Level Bounce V1"
version: "1.0.1"
description: >
  Captures bounces from demand/supply key levels confirmed by a 15m structure
  break. Targets a 3R move (≈150-250 pips on XAUUSD) with a fixed 50-pip stop.

filters:
  symbols: [XAUUSD]
  sessions: [LONDON, OVERLAP, NY]

setup:
  - id: trend_bias
    feature: features_bias
    tf: 1h
    predicate: "direction != 'neutral'"
    required: true

  - id: directional_zone
    feature: features_pricing
    tf: 15m
    predicate: |
      (features_bias.direction = 'bullish' AND position IN ('discount', 'deep_discount', 'equilibrium'))
      OR
      (features_bias.direction = 'bearish' AND position IN ('premium', 'deep_premium', 'equilibrium'))
    required: true

  - id: htf_zone
    feature: features_zone
    tf: 15m
    predicate: "zone_kind IN ('demand', 'supply') AND fill_pct < 0.95"
    required: true

entry:
  - id: structure_break
    feature: features_structure
    tf: 15m
    predicate: "event_type IN ('bos', 'mss') AND direction = features_bias.direction"
    required: true

  - id: zone_retest
    feature: features_zone
    tf: 15m
    predicate: "zone_kind IN ('demand', 'supply') AND fill_pct < 0.95"
    required: true

risk:
  sl: "0.50"
  tp: "sl * 3.0"
  minRR: 3.0
  timeoutBars: 360
  maxFillBars: 90

gates:
  - id: session_gate
    name: session
    params:
      allowed: [LONDON, OVERLAP, NY]

  - id: portfolio_heat
    name: portfolioHeat
    params:
      maxConcurrentPerSymbol: 1
      maxConcurrentTotal: 3

live:
  mode: paper
  structureFreshnessMinutes: 120
  lotSize: 0.01
  riskPerTradePct: 1.0
  accountBalance: 10000
  accountCurrency: USD
  signalTtlMinutes: 15
  maxSpreadPips: 3.0
  maxSlippagePoints: 20
  entryZonePips: null
