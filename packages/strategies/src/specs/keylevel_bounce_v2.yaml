id: keylevel_bounce_v2
active: true
name: "Key-Level Bounce V2"
version: "2.0.0"
description: >
  Improved key-level bounce. Adds a 1m zone-retest confirmation (wick into the
  level + directional close) to avoid entries that never actually touch the zone.
  Uses a volatility-based ATR stop.

filters:
  symbols: [XAUUSD]
  sessions: [LONDON, OVERLAP, NY]

setup:
  - id: trend_bias
    feature: features_bias
    tf: 1h
    predicate: "direction != 'neutral'"
    required: true

  - id: directional_zone
    feature: features_pricing
    tf: 15m
    predicate: |
      (features_bias.direction = 'bullish' AND position IN ('discount', 'deep_discount', 'equilibrium'))
      OR
      (features_bias.direction = 'bearish' AND position IN ('premium', 'deep_premium', 'equilibrium'))
    required: true

  - id: htf_zone
    feature: features_zone
    tf: 15m
    predicate: "zone_kind IN ('demand', 'supply') AND fill_pct < 0.95"
    required: true

entry:
  - id: structure_break
    feature: features_structure
    tf: 15m
    predicate: "event_type IN ('bos', 'mss') AND direction = features_bias.direction"
    required: true

  - id: zone_retest_confirm
    feature: features_zone_retest
    tf: 1m
    predicate: "wick_into_zone = true AND direction = features_bias.direction"
    required: true

risk:
  sl: "atr(15m) * 2.0"
  tp: "sl * 3.0"
  minRR: 3.0
  timeoutBars: 480
  maxFillBars: 120

gates:
  - id: session_gate
    name: session
    params:
      allowed: [LONDON, OVERLAP, NY]

  - id: portfolio_heat
    name: portfolioHeat
    params:
      maxConcurrentPerSymbol: 1
      maxConcurrentTotal: 3

live:
  mode: paper
  structureFreshnessMinutes: 120
  lotSize: 0.01
  riskPerTradePct: 1.0
  accountBalance: 10000
  accountCurrency: USD
  signalTtlMinutes: 15
  maxSpreadPips: 3.0
  maxSlippagePoints: 20
  entryZonePips: null
