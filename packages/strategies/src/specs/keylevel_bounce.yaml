id: keylevel_bounce
familyId: keylevel_bounce
active: false
name: Key-Level Bounce
version: 2.0.0
description: >
  Captures bounces from demand/supply key levels confirmed by a 15m structure break. Targets a 3R move (≈150-250 pips on
  XAUUSD) with a fixed 50-pip stop. v2: Progressive steps replaces flat setup[].
filters:
  symbols:
    - XAUUSD
  sessions:
    - LONDON
    - OVERLAP
    - NY
steps:
  - id: trend_bias
    feature: features_bias
    tf: 1h
    predicate: direction != 'neutral'
    required: true

  - id: directional_zone
    feature: features_pricing
    tf: 15m
    predicate: position IN ('discount', 'deep_discount', 'equilibrium', 'premium', 'deep_premium')
    required: true
    dependsOn: [trend_bias]
    autoAlignDirection: false
    ttlMinutes: 30

  - id: htf_zone
    feature: features_zone
    tf: 15m
    predicate: zone_kind IN ('demand', 'supply') AND fill_pct < 0.95
    required: true
    dependsOn: [directional_zone]
    ttlMinutes: 240

entry:
  - id: structure_break
    feature: features_structure
    tf: 15m
    predicate: event_type IN ('bos', 'mss')
    required: true
risk:
  sl: 50 pips
  tp: sl * 3.0
  minRR: 3
  timeoutBars: 360
  maxFillBars: 90
gates:
  - id: session_gate
    name: session
    params:
      allowed:
        - LONDON
        - OVERLAP
        - NY
  - id: portfolio_heat
    name: portfolioHeat
    params:
      maxConcurrentPerSymbol: 1
      maxConcurrentTotal: 3

  - id: direction_alignment_gate
    name: directionAlignment
    params:
      enabled: true
      timeframes: ["1h", "15m"]
      require: majority
      allowNeutral: true
live:
  mode: paper
  structureFreshnessMinutes: 120
  lotSize: 0.01
  riskPerTradePct: 1
  accountBalance: 10000
  accountCurrency: USD
  signalTtlMinutes: 15
  maxSpreadPips: 3
  maxSlippagePoints: 20
