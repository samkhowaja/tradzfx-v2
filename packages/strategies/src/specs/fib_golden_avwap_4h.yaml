id: fib_golden_avwap_4h
familyId: fib_golden
setupFamily: trend_pullback
active: false
name: "Fibonacci Golden Zone + Anchored VWAP"
version: "1.0.0"
description: >
  4H strategy: Fibonacci golden zone (50-61.8% retracement) with premium/discount
  (proxying anchored VWAP mean-reversion confluence). Price in discount/premium
  near the golden zone provides the mean-reversion confluence. Engulfing bar entry.
  No dedicated anchored VWAP feature exists in this system — features_pricing
  premium/discount is the closest proxy for VWAP relative-position.

filters:
  symbols:
    - EURUSD
    - GBPUSD
    - XAUUSD
  sessions:
    - LONDON
    - OVERLAP
    - NY

setup:
  - id: bias
    feature: features_bias
    tf: 4h
    predicate: "direction != 'neutral'"
    required: true
    weight: 8

  - id: golden_zone
    feature: features_pricing
    tf: 4h
    predicate: "fib_position IN ('500_618', '618_786') AND in_ote = true AND position IS NOT NULL"
    required: true
    weight: 10

  - id: vwap_confluence
    feature: features_pricing
    tf: 4h
    # For bullish bias: price in discount (below VWAP proxy) waiting to revert up.
    # For bearish bias: price in premium (above VWAP proxy) waiting to revert down.
    # This mirrors anchored VWAP mean-reversion from the video.
    predicate: >
      (features_bias.direction = 'bullish' AND position IN ('discount', 'deep_discount'))
      OR
      (features_bias.direction = 'bearish' AND position IN ('premium', 'deep_premium'))
    required: true
    weight: 7

entry:
  - id: engulfing
    feature: features_candle_pattern
    tf: 4h
    predicate: "pattern_name IN ('engulfing_bull', 'engulfing_bear') AND direction = features_bias.direction AND confidence >= 0.6"
    required: true
    weight: 10
    lookbackBars: 6

entryConfig:
  type: market
  zonePips: null

signalSource: zone

risk:
  sl: "atr(4h) * 1.5"
  tp: "sl * 3.0"
  minRR: 3.0
  timeoutBars: 24
  maxFillBars: 6
  minSlDistancePips: 5.0

gates:
  - id: session_gate
    name: session
    params:
      allowed:
        - LONDON
        - OVERLAP
        - NY

  - id: spread_gate
    name: spread
    params:
      maxSpreadPips: 3.0

  - id: volatility_gate
    name: volatility
    params:
      maxAtr5Pips: 65

  - id: portfolio_heat
    name: portfolioHeat
    params:
      maxConcurrentPerSymbol: 1
      maxConcurrentTotal: 3

  - id: direction_alignment_gate
    name: directionAlignment
    params:
      enabled: true
      timeframes: ["1d", "4h", "1h"]
      require: all
      allowNeutral: true

  - id: rate_limit
    name: rateLimit
    params:
      maxSignalsPerHour: 1
      maxSignalsPerDay: 3

  - id: daily_loss
    name: dailyLoss
    params:
      maxLossesPerDay: 2

live:
  mode: paper
  lotSize: 0.01
  riskPerTradePct: 1.0
  accountBalance: 10000
  accountCurrency: USD
  signalTtlMinutes: 60
  maxSpreadPips: 3.0
  maxSlippagePoints: 20
  entryZonePips: null
  maxPositionsPerSymbol: 1
  maxPositionsTotal: 3
  cooldownMinutes: 240
