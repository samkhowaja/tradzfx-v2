id: waqar_v2_loose
familyId: waqar_v2
active: true
name: Waqar Asim Scalp V2 — No Time Window
version: 2.1.0
description: >
  Same multi-timeframe logic as waqar_v2, but removes the tight 08:00-09:00 / 14:00-15:00 UTC windows so it can fire
  throughout the London and overlap sessions.
overrides:
  filters: {}
  setup:
    - id: htf_zone
      feature: features_zone
      tf: 1h
      predicate: zone_kind IN ('demand', 'supply')
      required: true
      weight: 8
    - id: trend_bias
      feature: features_bias
      tf: 15m
      predicate: direction != 'neutral'
      required: true
      weight: 8
    - id: directional_zone
      feature: features_pricing
      tf: 4h
      predicate: |
        (features_bias.direction = 'bullish' AND position IN ('discount', 'deep_discount'))
        OR
        (features_bias.direction = 'bearish' AND position IN ('premium', 'deep_premium'))
      required: true
      weight: 10
  entry:
    - id: structure_break
      feature: features_structure
      tf: 1m
      predicate: event_type IN ('bos', 'mss') AND direction = features_bias.direction
      required: true
      weight: 10
    - id: zone_retest
      feature: features_zone
      tf: 1m
      predicate: zone_kind IN ('demand', 'supply') AND fill_pct < 0.8 AND tapped = false
      required: true
      weight: 10
    - id: displacement_confirm
      feature: features_displacement
      tf: 1m
      predicate: grade IN ('MEDIUM', 'HIGH')
      required: false
      weight: 5
    - id: dxy_alignment
      feature: features_correlation
      tf: 15m
      predicate: reference_symbol = 'DXY' AND divergence_detected = false
      required: false
      weight: 6
  notes:
    - Removes the narrow time windows from the base spec
    - Trades the full London / overlap window
