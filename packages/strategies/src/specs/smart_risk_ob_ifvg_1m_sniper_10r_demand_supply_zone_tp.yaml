id: smart_risk_ob_ifvg_1m_sniper_10r_demand_supply_zone_tp
active: true
name: "Smart Risk Sniper 10R — demand/supply + HTF zone TP beyond minRR [EXPERIMENTAL]"
version: "1.0.0"
description: >
  Sniper variant using HTF zone TP beyond minRR.
filters:
  symbols: [XAUUSD]
  sessions: [LONDON, OVERLAP, NY]
  timeWindows:
    - { utcStart: "08:00", utcEnd: "09:59" }
    - { utcStart: "11:00", utcEnd: "11:30" }
    - { utcStart: "13:30", utcEnd: "15:59" }

setup:
  - id: bias
    feature: features_bias
    tf: 15m
    predicate: "direction != 'neutral'"
    required: true
    weight: 8

  - id: htf_zone
    feature: features_zone
    tf: 15m
    predicate: "zone_kind IN ('demand', 'supply') AND fill_pct < 0.8 AND is_fresh = true"
    required: true
    weight: 8

  - id: htf_ob
    feature: features_order_block
    tf: 15m
    predicate: "ob_kind = features_bias.direction"
    required: false
    weight: 5

  - id: htf_sweep
    feature: features_sweep
    tf: 15m
    predicate: "direction = features_bias.direction"
    required: false
    weight: 3

  - id: pricing_filter
    feature: features_pricing
    tf: 5m
    predicate: "position IN ('premium', 'deep_premium', 'equilibrium', 'discount', 'deep_discount')"
    required: true
    weight: 1

entry:
  - id: ltf_ifvg
    feature: features_ifvg
    tf: 5m
    predicate: "direction = features_bias.direction AND fill_pct >= 0.5 AND is_fresh = true"
    required: true
    weight: 10

  - id: ltf_structure
    feature: features_structure
    tf: 5m
    predicate: "event_type IN ('bos', 'mss', 'choch') AND direction = features_bias.direction"
    required: false
    weight: 5

entryConfig:
  type: limit
  zonePips: 0

risk:
  sl: "0.10"
  tp: "opposing_zone_profit_beyond_min_rr"
  tpOffsetPips: 0
  minRR: 10.0
  timeoutBars: 480
  maxFillBars: 30

gates:
  - id: session_gate
    name: session
    params:
      allowed: [LONDON, OVERLAP, NY]

  - id: spread_gate
    name: spread
    params:
      maxSpreadPips: 2.0

  - id: volatility_gate
    name: volatility
    params:
      maxAtr5: 3.0

  - id: daily_loss
    name: dailyLoss
    params:
      maxLossesPerDay: 3

  - id: portfolio_heat
    name: portfolioHeat
    params:
      maxConcurrentPerSymbol: 1
      maxConcurrentTotal: 3

live:
  mode: paper
  lotSize: 0.01
  riskPerTradePct: 1.0
  accountBalance: 10000
  accountCurrency: USD
  signalTtlMinutes: 15
  maxSpreadPips: 2.0
  maxSlippagePoints: 10
  entryZonePips: null
  maxPositionsPerSymbol: 1
  maxPositionsTotal: 3
  cooldownMinutes: 30
  structureFreshnessMinutes: 60
