id: smart_risk_ob_ifvg_1m_runon_15r_ob_tp
familyId: smart_risk_ob_ifvg_1m
active: true
name: Smart Risk Scalp 1 — OB + iFVG (run-on to next opposing order block beyond 1.5R, fixed fallback)
version: 1.0.2
description: >
  Primary live candidate. Variant of strategy 1 that targets the nearest opposing swing pivot with a 1.5R floor and
  includes a daily-loss circuit breaker. The iFVG trigger uses the new multi-candle reversal confirmation from the
  engine.
overrides:
  entry:
    - id: ltf_ifvg
      feature: features_ifvg
      tf: 5m
      predicate: direction = features_bias.direction AND fill_pct >= 0.5 AND is_fresh = true AND age_bars < 10
      required: true
      weight: 10
    - id: ltf_structure
      feature: features_structure
      tf: 5m
      predicate: event_type IN ('bos', 'mss', 'choch') AND direction = features_bias.direction
      required: false
      weight: 5
  risk:
    tp: opposing_order_block_beyond_min_rr
    minRR: 1.5
    timeoutBars: 240
    tpOffsetPips: 0
  gates:
    - id: session_gate
      name: session
      params:
        allowed:
          - LONDON
          - OVERLAP
          - NY
    - id: spread_gate
      name: spread
      params:
        maxSpreadPips: 5
    - id: volatility_gate
      name: volatility
      params:
        maxAtr5Pips: 3
    - id: daily_loss
      name: dailyLoss
      params:
        maxLossesPerDay: 3
    - id: portfolio_heat
      name: portfolioHeat
      params:
        maxConcurrentPerSymbol: 1
        maxConcurrentTotal: 3
