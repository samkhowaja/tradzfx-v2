id: forex_strategy_orb
familyId: forex_strategy_orb
active: true
name: "Displacement ORB"
version: "1.1.0"
description: >
  Opening range breakout with displacement confirmation and S/D zone confluence.
  Based on ForexStrategy.txt: 15m NYSE opening range, 5m execution, retest of
  demand/supply or FVG, target 1.5–2R.

filters:
  symbols: [ EURUSD, GBPUSD, AUDUSD, NZDUSD, USDCAD, USDCHF, USDJPY, XAUUSD ]
  sessions: [ LONDON, OVERLAP, NY ]
  timeWindows:
    - { utcStart: "13:30", utcEnd: "15:00" }

setup:
  - id: bias
    feature: features_bias
    tf: 1h
    predicate: "direction != 'neutral'"
    required: true

  - id: orb
    feature: features_opening_range
    tf: 15m
    # Session-scoped join (V4 BUG-11 fix): 13:30-15:00 UTC window -> the only
    # same-day completed opening range is London's (complete 07:15 UTC).
    session: london
    predicate: "1 = 1"
    required: true

  - id: sd_zone
    feature: features_zone
    tf: 5m
    predicate: "zone_kind IN ('demand', 'supply', 'fvg') AND is_fresh = true AND
      quality_score > 0.05"
    required: true
    groupBy: [ zone_kind ]

  - id: displacement
    feature: features_displacement
    tf: 5m
    predicate: "grade IN ('LOW', 'MEDIUM', 'HIGH') AND consecutive_count >= 1 AND
      sequence_grade IN ('LOW', 'MEDIUM', 'HIGH')"
    required: true

entry:
  - id: msb
    feature: features_structure
    tf: 5m
    predicate: "event_type IN ('bos', 'mss') AND direction = features_bias.direction"
    required: false
    groupBy: [ event_type, direction ]

  - id: zone_retest
    feature: features_zone_retest
    tf: 5m
    predicate: "(engulfing_at_zone = true OR wick_into_zone = true) AND direction =
      features_bias.direction"
    required: true

signalSource: orb

risk:
  sl: "atr(5m) * 1.2"
  tp: "sl * 2.0"
  minRR: 2.0
  timeoutBars: 24
  maxFillBars: 6

gates:
  - id: volatility_gate
    name: volatility
    params:
      maxAtr5Pips: 2.5

  - id: spread_gate
    name: spread
    params:
      maxSpreadPips: 3.0

  - id: portfolio_heat
    name: portfolioHeat
    params:
      maxConcurrentPerSymbol: 1
      maxConcurrentTotal: 4

  - id: session_gate
    name: session
    params:
      allowed: [ LONDON, OVERLAP, NY ]

  - id: rate_limit
    name: rateLimit
    params:
      maxSignalsPerHour: 2
      maxSignalsPerDay: 5

  - id: daily_loss
    name: dailyLoss
    params:
      maxLossesPerDay: 2

live:
  mode: paper
  lotSize: 0.01
  riskPerTradePct: 1.0
  accountBalance: 10000
  accountCurrency: USD
  signalTtlMinutes: 30
  maxSpreadPips: 3.0
  maxSlippagePoints: 20
  entryZonePips: null
  maxPositionsPerSymbol: 1
  maxPositionsTotal: 4
  cooldownMinutes: 45
  structureFreshnessMinutes: 15
