id: waqar_v2
familyId: waqar_v2
active: true
name: "Waqar Asim Scalp"
version: "3.1.0"
description: >
  Waqar Asim's Forex scalping strategy: 1H decisional supply/demand
  context, 15m trend bias, 1m execution. Trade during the 8-9am and 2-3pm
  London windows across FX majors (no gold). The pricing filter is run as a
  momentum continuation filter: long in premium / short in discount, because the
  1H pricing position acts as a trend proxy in this dataset. Entry after
  BOS/MSS/CHOCH followed by an inducement/retest into a lower-timeframe S/D zone.
  5 pip stop, 3R take-profit.

filters:
  symbols: [ EURUSD, GBPUSD, AUDUSD, NZDUSD, USDCAD, USDCHF, USDJPY ]
  sessions: [ LONDON, OVERLAP ]
  timeWindows:
    - { utcStart: "08:00", utcEnd: "09:00" }
    - { utcStart: "14:00", utcEnd: "15:00" }

setup:
  - id: htf_zone
    feature: features_zone
    tf: 1h
    predicate: "zone_kind IN ('demand', 'supply') AND is_fresh = true"
    required: true
    groupBy: [ zone_kind ]

  - id: trend_bias
    feature: features_htf_bias
    tf: 15m
    predicate: "direction != 'neutral' AND state IN ('READY', 'SOFT_WARN')"
    required: true

  - id: premium_discount
    feature: features_pricing
    tf: 1h
    predicate: |
      (features_htf_bias.direction = 'bullish' AND position IN ('premium', 'deep_premium'))
      OR
      (features_htf_bias.direction = 'bearish' AND position IN ('discount', 'deep_discount'))
    required: true

entry:
  - id: structure_break
    feature: features_structure
    tf: 1m
    predicate: "event_type IN ('bos', 'mss', 'choch') AND direction = features_htf_bias.direction"
    required: true
    groupBy: [ direction ]
    ignoreLifecycle: true

  - id: zone_retest
    feature: features_zone
    tf: 1m
    predicate: "zone_kind IN ('demand', 'supply', 'fvg') AND is_fresh = true AND fill_pct <= 1.0 AND direction = features_htf_bias.direction"
    required: false
    groupBy: [ zone_kind ]

  - id: displacement_confirm
    feature: features_displacement
    tf: 1m
    predicate: "grade IN ('MEDIUM', 'HIGH') AND direction = features_htf_bias.direction"
    required: false

signalSource: zone

risk:
  sl: "5 pips"
  tp: "sl * 3.0"
  minRR: 3.0
  timeoutBars: 180
  maxFillBars: 45

gates:
  - id: spread_gate
    name: spread
    params:
      maxSpreadPips: 3.0

  - id: session_gate
    name: session
    params:
      allowed: [ LONDON, OVERLAP ]

  - id: portfolio_heat
    name: portfolioHeat
    params:
      maxConcurrentPerSymbol: 1
      maxConcurrentTotal: 2

live:
  mode: paper
  lotSize: 0.01
  riskPerTradePct: 1.0
  accountBalance: 10000
  accountCurrency: USD
  signalTtlMinutes: 15
  maxSpreadPips: 3.0
  maxSlippagePoints: 20
  entryZonePips: null
  maxPositionsPerSymbol: 1
  maxPositionsTotal: 2
  cooldownMinutes: 30
  structureFreshnessMinutes: 180

notes:
  - "Expanded to all FX majors; XAUUSD excluded because its minimumExecutionTf is 5m."
  - "Pricing filter inverted vs the PDF: momentum continuation (long premium, short discount)."
  - "5 pip hard stop, 3R TP (full position); portfolio heat capped at 1 per symbol / 2 total."
  - "Loose entry: BOS/MSS/CHOCH on 1m + 1m zone/iFVG retest aligned with bias."
