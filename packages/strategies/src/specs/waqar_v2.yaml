id: waqar_v2
familyId: waqar_v2
active: true
name: "Waqar Asim Scalp V2"
version: "2.0.0"
description: >
  ICT-based supply/demand scalp strategy. 1H decisional context, 15m trend bias,
  1m entry after MSB/BOS + zone retest. Only long in discount, only short in
  premium.

filters:
  symbols: [ EURUSD, GBPUSD, AUDUSD, NZDUSD, USDCAD, USDCHF, USDJPY, XAUUSD ]
  sessions: [ LONDON, OVERLAP ]
  timeWindows:
    - { utcStart: "08:00", utcEnd: "09:00" }
    - { utcStart: "14:00", utcEnd: "15:00" }

setup:
  - id: htf_zone
    feature: features_zone
    tf: 1h
    predicate: "zone_kind IN ('demand', 'supply')"
    required: true
    weight: 8

  - id: trend_bias
    feature: features_htf_bias
    tf: 15m
    predicate: "direction != 'neutral' AND state IN ('READY', 'SOFT_WARN')"
    required: true
    weight: 8

  - id: directional_zone
    feature: features_pricing
    tf: 4h
    predicate: |
      (features_htf_bias.direction = 'bullish' AND position IN ('discount', 'deep_discount'))
      OR
      (features_htf_bias.direction = 'bearish' AND position IN ('premium', 'deep_premium'))
    required: true
    weight: 10

entry:
  - id: structure_break
    feature: features_structure
    tf: 1m
    predicate: "event_type IN ('bos', 'mss') AND direction = features_htf_bias.direction"
    required: true
    weight: 10

  - id: zone_retest
    feature: features_zone
    tf: 1m
    predicate: "zone_kind IN ('demand', 'supply', 'fvg') AND fill_pct < 0.8"
    required: true
    weight: 10

  - id: displacement_confirm
    feature: features_displacement
    tf: 1m
    predicate: "grade IN ('MEDIUM', 'HIGH')"
    required: false
    weight: 5

  - id: dxy_alignment
    feature: features_correlation
    tf: 15m
    predicate: "reference_symbol = 'DXY' AND divergence_detected = false"
    required: false
    weight: 6

risk:
  sl: "atr(1m) * 1.2"
  tp: "sl * 3.0"
  minRR: 3.0
  timeoutBars: 180
  maxFillBars: 45

gates:
  - id: volatility_gate
    name: volatility
    params:
      maxAtr5Pips: 2.0

  - id: spread_gate
    name: spread
    params:
      maxSpreadPips: 3.0

  - id: portfolio_heat
    name: portfolioHeat
    params:
      maxConcurrentPerSymbol: 2
      maxConcurrentTotal: 6

  - id: session_gate
    name: session
    params:
      allowed: [ LONDON, OVERLAP ]

live:
  mode: paper
  lotSize: 0.01
  riskPerTradePct: 1.0
  accountBalance: 10000
  accountCurrency: USD
  signalTtlMinutes: 15
  maxSpreadPips: 3.0
  maxSlippagePoints: 20
  entryZonePips: null # disabled for market orders; zone guard only makes sense for limit orders
  maxPositionsPerSymbol: 1
  maxPositionsTotal: 6
  cooldownMinutes: 30
  structureFreshnessMinutes: 30

notes:
  - " STRICT EBOOK TRANSLATION"
  - "Symbols: All 8 major pairs + gold"
  - "Directional zone check is REQUIRED — replaces two optional zone checks"
  - "SL uses ATR * 1.2 (~5-8 pips on forex during London)"
  - "Single TP at 3R (no partials)"
