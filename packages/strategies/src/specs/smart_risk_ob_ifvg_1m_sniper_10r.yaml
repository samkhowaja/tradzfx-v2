id: smart_risk_ob_ifvg_1m_sniper_10r
familyId: smart_risk_ob_ifvg_1m
active: false
name: Smart Risk Sniper 10R — OB + iFVG (tight 10-pip SL, 10R fixed TP) [EXPERIMENTAL]
version: 1.0.2
description: >
  Experimental sniper variant. Tight 0.10 (10-pip) stop with a fixed 10R take-profit. Same entry filters as the primary,
  but trades infrequent large wins instead of frequent small wins.
overrides:
  entry:
    - id: ltf_ifvg
      feature: features_ifvg
      tf: 5m
      predicate: direction = features_bias.direction AND fill_pct >= 0.5 AND is_fresh = true
      required: true
      weight: 10
    - id: ltf_structure
      feature: features_structure
      tf: 5m
      predicate: event_type IN ('bos', 'mss', 'choch') AND direction = features_bias.direction
      required: false
      weight: 5
  entryConfig:
    type: limit
    zonePips: 0
  risk:
    sl: 10 pips
    tp: sl * 10
    minRR: 10
    timeoutBars: 480
    tpOffsetPips: 0
  gates:
    - id: session_gate
      name: session
      params:
        allowed:
          - LONDON
          - OVERLAP
          - NY
    - id: spread_gate
      name: spread
      params:
        maxSpreadPips: 2
    - id: volatility_gate
      name: volatility
      params:
        maxAtr5Pips: 3
    - id: daily_loss
      name: dailyLoss
      params:
        maxLossesPerDay: 3
    - id: portfolio_heat
      name: portfolioHeat
      params:
        maxConcurrentPerSymbol: 1
        maxConcurrentTotal: 3
  live:
    maxSpreadPips: 2
    maxSlippagePoints: 10
