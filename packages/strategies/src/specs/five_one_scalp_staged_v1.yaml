id: five_one_scalp_staged_v1
familyId: five_one_scalp
active: false
experimental: true
name: "5m Setup / 1m Entry Scalp — Ordered Staged"
version: "0.1.0"
description: >
  Research/shadow variant of five_one_scalp_v1. Uses explicit event chronology:
  direction context, exact 5m zone, 5m structure, candle-reconstructed touch,
  then same-direction 1m BOS. Disabled for live orders until PIT/shadow parity.

filters:
  symbols: [ XAUUSD ]
  sessions: [ LONDON, NY ]
  timeWindows:
    - { utcStart: "07:00", utcEnd: "16:30" }

warmupBars: 200

staged:
  enabled: true
  mode: compare
  context:
    tf: 5m
    maxAgeBars: 12
    requireAgreement: false
  setup:
    tf: 5m
    eventTypes: [ bos, mss ]
    maxAgeBars: 6
    requireZone: true
    zoneKinds: [ fvg, order_block ]
    zoneMaxAgeBars: 24
  entry:
    tf: 1m
    eventTypes: [ bos ]
    maxBarsAfterTouch: 5
  cancellation:
    onBiasFlip: true
    onZoneInvalidation: true
    oneTradePerSetup: true

# Legacy condition lists remain for compiler compatibility and baseline coverage
# checks. Ordered evaluator consumes the staged contract above.
setup:
  - id: htf_structure
    feature: features_structure
    tf: 5m
    predicate: "event_type IN ('bos','mss')"
    required: true
    lookbackBars: 96
  - id: htf_zone
    feature: features_zone
    tf: 5m
    predicate: "zone_kind IN ('fvg','order_block') AND fill_pct < 0.85"
    required: true
    lookbackBars: 48
  - id: htf_atr
    feature: features_atr
    tf: 5m
    predicate: "value > 0"
    required: false
    lookbackBars: 96
  - id: htf_direction
    feature: features_direction_state
    tf: 5m
    predicate: "direction IN ('buy','sell')"
    required: true
    lookbackBars: 96
  - id: htf_pricing_anchor
    feature: features_pricing
    tf: 5m
    predicate: "position IN ('discount','deep_discount','premium','deep_premium')"
    required: false
    lookbackBars: 96

entry:
  - id: ltf_structure
    feature: features_structure
    tf: 1m
    predicate: "event_type = 'bos'"
    required: true
    lookbackBars: 5

entryConfig:
  type: market

risk:
  sl: "atr(5m) * 1.5"
  tp: "sl * 2.0"
  minRR: 2.0
  timeoutBars: 90
  maxFillBars: 30

signalSource: generic
setupFamily: trend_pullback

gates:
  - id: session_gate
    name: session
    params:
      allowed: [ LONDON, OVERLAP, NY ]
  - id: spread_gate
    name: spread
    params:
      maxSpreadPips: 5.0
  - id: volatility_gate
    name: volatility
    params:
      maxAtrPercentile: 0.95
      maxAtr5Pips: 30.0
  - id: portfolio_heat
    name: portfolioHeat
    params:
      maxOpenRiskPct: 2.0
