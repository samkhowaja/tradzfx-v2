id: keylevel_bounce_v8c_min3
familyId: keylevel_bounce
active: true
dxyDependency: not_required
name: Key-Level Bounce V8c (level TP, minRR 3)
version: 9.0.0
description: >
  Short-only key-level bounce restricted to the best-performing UTC hours. TP is set at the nearest opposing swing pivot
  wick (nearest_profit_pivot), pulled 2 pips inside the wick. SL stays fixed at 50 pips.
overrides:
  filters:
    sessions:
      - OVERLAP
      - NY
  steps:
    - id: trend_bias
      feature: features_bias
      tf: 1h
      predicate: direction = 'bearish'
      required: true

    - id: directional_zone
      feature: features_pricing
      tf: 15m
      predicate: position IN ('premium', 'deep_premium', 'equilibrium')
      required: true
      dependsOn: [trend_bias]
      autoAlignDirection: false
      ttlMinutes: 30

    - id: htf_zone
      feature: features_zone
      tf: 15m
      predicate: zone_kind IN ('demand', 'supply') AND fill_pct < 0.95
      required: true
      dependsOn: [directional_zone]
      ttlMinutes: 240

  entry:
    - id: structure_break
      feature: features_structure
      tf: 15m
      predicate: event_type IN ('bos', 'mss') AND direction = 'bearish'
      required: true

  risk:
    tp: nearest_profit_pivot
    timeoutBars: 480
    maxFillBars: 120
    tpOffsetPips: -2
  gates:
    - id: session_gate
      name: session
      params:
        allowed:
          - OVERLAP
          - NY
        windows:
          - 12:00-12:59
          - 14:00-14:59
          - 16:00-16:59
          - 17:00-17:59
          - 19:00-19:59
          - 20:00-20:59
    - id: portfolio_heat
      name: portfolioHeat
      params:
        maxConcurrentPerSymbol: 1
        maxConcurrentTotal: 3
