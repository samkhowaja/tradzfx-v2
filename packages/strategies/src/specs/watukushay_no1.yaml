id: watukushay_no1
familyId: watukushay
active: true
name: Watukushay No.1
version: 1.2.0
description: >
  MA cross strategy per Daniel Pinto's Watukushay No.1 system. Trades in the direction of the 1h bias when SMA 15 is
  above/below SMA 250. Uses the new configurable features_moving_average table.
overrides:
  setup:
    - id: bias
      feature: features_bias
      tf: 1h
      predicate: direction != 'neutral'
      required: true
    - id: ma_fast
      feature: features_moving_average
      tf: 1h
      predicate: ma_type = 'sma' AND period = 15 AND value > 0
      required: true
      groupBy:
        - ma_type
        - period
    - id: ma_slow
      feature: features_moving_average
      tf: 1h
      predicate: ma_type = 'sma' AND period = 250 AND value > 0
      required: true
      groupBy:
        - ma_type
        - period
  signalSource: moving_average
  signalSourceConfig:
    maType: sma
    fastPeriod: 15
    slowPeriod: 250
  live:
    maxPositionsPerSymbol: 2
    maxPositionsTotal: 6
