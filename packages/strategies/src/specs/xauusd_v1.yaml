id: xauusd_v1
familyId: xauusd_v1
active: true
name: "XAUUSD Engine-First Scalp V1"
version: "1.0.0"
description: >
  Gold-specific scalp strategy that leverages the engine-level improvements from
  the XAUUSD analysis review: time-of-day edge, structural liquidity pools, and
  higher minimum execution timeframe. DXY alignment is optional; overlap session
  is excluded.

filters:
  symbols: [ XAUUSD ]
  sessions: [ LONDON, NY, LATE_NY ]
  timeWindows:
    - { utcStart: "07:00", utcEnd: "09:00" } # London continuation / Asia-range breakout
    - { utcStart: "15:00", utcEnd: "16:30" } # Late NY onset (avoid 13:00-14:30 NY open chop)
    - { utcStart: "18:00", utcEnd: "21:00" } # Late NY trend window

setup:
  - id: htf_zone
    feature: features_zone
    tf: 1h
    predicate: "zone_kind IN ('demand', 'supply')"
    required: true
    weight: 8

  - id: trend_bias
    feature: features_bias
    tf: 15m
    predicate: "direction != 'neutral'"
    required: true
    weight: 8

  - id: directional_zone
    feature: features_pricing
    tf: 4h
    predicate: |
      (features_bias.direction = 'bullish' AND position IN ('discount', 'deep_discount'))
      OR
      (features_bias.direction = 'bearish' AND position IN ('premium', 'deep_premium'))
    required: true
    weight: 10

  - id: time_of_day_edge
    feature: features_time_of_day_edge
    tf: 15m
    predicate: "edge IN ('STRONG', 'GOOD', 'NEUTRAL')"
    required: true
    weight: 9

entry:
  - id: structure_break
    feature: features_structure
    tf: 5m
    predicate: "event_type IN ('bos', 'mss') AND direction = features_bias.direction"
    required: true
    weight: 10

  - id: zone_retest
    feature: features_zone
    tf: 5m
    predicate: "zone_kind IN ('demand', 'supply') AND fill_pct < 0.8 AND tapped = false"
    required: true
    weight: 10

  - id: liquidity_pool_sweep
    feature: features_liquidity_pools
    tf: 5m
    predicate: "recent_sweep_matched = true"
    required: true
    weight: 9

  - id: displacement_confirm
    feature: features_displacement
    tf: 5m
    predicate: "grade IN ('MEDIUM', 'HIGH')"
    required: false
    weight: 5

  - id: dxy_alignment
    feature: features_correlation
    tf: 15m
    predicate: "reference_symbol = 'DXY' AND divergence_detected = false"
    required: false
    weight: 4

risk:
  sl: "atr(5m) * 1.5"
  tp: "sl * 3.0"
  minRR: 2.5
  timeoutBars: 180
  maxFillBars: 45

gates:
  - id: volatility_gate
    name: volatility
    params:
      maxAtr5Pips: 3.0

  - id: spread_gate
    name: spread
    params:
      maxSpreadPips: 5.0

  - id: portfolio_heat
    name: portfolioHeat
    params:
      maxConcurrentPerSymbol: 1
      maxConcurrentTotal: 4

  - id: session_gate
    name: session
    params:
      allowed: [ LONDON, NY, LATE_NY ]

live:
  mode: paper
  lotSize: 0.01
  riskPerTradePct: 1.0
  accountBalance: 10000
  accountCurrency: USD
  signalTtlMinutes: 15
  maxSpreadPips: 5.0
  maxSlippagePoints: 30
  entryZonePips: null
  maxPositionsPerSymbol: 1
  maxPositionsTotal: 4
  cooldownMinutes: 30
  structureFreshnessMinutes: 30

notes:
  - "Engine-first design: most logic lives in deterministic engine features."
  - "Requires V2 DAG features: features_time_of_day_edge,
    features_liquidity_pools."
  - "Overlap session excluded due to 22% WR in backtests."
  - "Minimum execution TF raised to 5m to reduce 1m noise on Gold."
