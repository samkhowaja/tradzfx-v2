id: keylevel_bounce_v1_limit
familyId: keylevel_bounce
active: true
dxyDependency: not_required
name: Key-Level Bounce V1 (limit entry)
version: 1.0.0
description: >
  Same key-level setup as v1, but uses a limit order placed at the zone edge. Avoids chasing price and only enters on a
  genuine retest.
overrides:
  entryConfig:
    type: limit
    zonePips: 0
  risk:
    tp: sl * 4.0
    minRR: 4
    timeoutBars: 480
    maxFillBars: 120
