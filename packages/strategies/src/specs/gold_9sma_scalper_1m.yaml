id: gold_9sma_scalper_1m
familyId: gold_9sma_scalper
setupFamily: trend_pullback
active: true
experimental: true
name: "Gold 9SMA Scalper 1m"
version: "2.0.0"
description: >
  1-minute gold scalper based on the 9-period SMA pullback strategy (YouTube
  transcript). Trades XAUUSD only during high-volatility sessions (LONDON,
  OVERLAP, NY). Uses 5m bias for trend direction and 5m SMA 9/21 cross for
  trend strength confirmation. Enters on 1m rejection candle patterns (hammer,
  pin bar, engulfing) at the pullback. Tight ATR-based SL, 2R target. The SMA
  cross acts as the surrogate for the video's "price pulling back to 9 SMA in
  an uptrend" — the fast MA staying above the slow MA confirms trend momentum.

filters:
  symbols: [XAUUSD]
  sessions: [LONDON, OVERLAP, NY]

setup:
  - id: bias
    feature: features_bias
    tf: 5m
    predicate: "direction != 'neutral'"
    required: true
    weight: 8
    lookbackBars: 8

  - id: ma_fast
    feature: features_moving_average
    tf: 5m
    predicate: "ma_type = 'sma' AND period = 9 AND value > 0"
    required: true
    groupBy:
      - ma_type
      - period

  - id: ma_slow
    feature: features_moving_average
    tf: 5m
    predicate: "ma_type = 'sma' AND period = 21 AND value > 0"
    required: true
    groupBy:
      - ma_type
      - period

entry:
  - id: candle_rejection
    feature: features_candle_pattern
    tf: 1m
    predicate: "pattern_name IN ('pin_bar', 'hammer', 'engulfing_bull', 'engulfing_bear', 'hanging_man') AND direction = features_bias.direction AND confidence >= 0.5"
    required: true
    weight: 10
    lookbackBars: 6

entryConfig:
  type: market
  zonePips: null

signalSource: moving_average
signalSourceConfig:
  maType: sma
  fastPeriod: 9
  slowPeriod: 21

risk:
  sl: "atr(1m) * 0.8"
  tp: "sl * 2.0"
  minRR: 2.0
  timeoutBars: 60
  maxFillBars: 15
  minSlDistancePips: 2.0

gates:
  - id: session_gate
    name: session
    params:
      allowed: [LONDON, OVERLAP, NY]

  - id: spread_gate
    name: spread
    params:
      maxSpreadPips: 5.0

  - id: volatility_gate
    name: volatility
    params:
      maxAtrPercentile: 0.95
      sessionMaxAtrPercentile:
        NY: 0.95
      maxAtr5Pips: 500

  - id: portfolio_heat
    name: portfolioHeat
    params:
      maxConcurrentPerSymbol: 1
      maxConcurrentTotal: 1

  - id: rate_limit
    name: rateLimit
    params:
      maxSignalsPerHour: 5
      maxSignalsPerDay: 15

  - id: daily_loss
    name: dailyLoss
    params:
      maxLossesPerDay: 10

  - id: daily_win
    name: dailyWin
    params:
      maxWinsPerDay: 10

live:
  mode: live
  lotSize: 0.01
  riskPerTradePct: 1.0
  accountBalance: 10000
  accountCurrency: USD
  signalTtlMinutes: 30
  maxSpreadPips: 5.0
  maxSlippagePoints: 15
  entryZonePips: null
  maxPositionsPerSymbol: 1
  maxPositionsTotal: 1
  cooldownMinutes: 5
