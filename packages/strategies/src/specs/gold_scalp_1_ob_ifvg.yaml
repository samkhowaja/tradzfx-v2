id: gold_scalp_1_ob_ifvg
familyId: gold_scalp_1_ob_ifvg
active: true
experimental: true
name: "Gold Scalp 1 — HTF Order Block + iFVG Entry"
version: "1.0.0"
description: >
  Video strategy 1 proxy: HTF order block / fresh zone context with LTF inverse
  FVG aligned to bias. HTF (15m) identifies order block after liquidity sweep +
  BOS. LTF (5m) iFVG forms within the OB zone. Market entry at iFVG formation.

filters:
  symbols: [ XAUUSD ]
  sessions: [ LONDON, OVERLAP, NY ]
  timeWindows:
    - { utcStart: "07:00", utcEnd: "11:00" }
    - { utcStart: "13:00", utcEnd: "16:30" }

setup:
  - id: htf_bias
    feature: features_bias
    tf: 15m
    predicate: "direction != 'neutral'"
    required: true
    weight: 8

  - id: htf_zone_fresh
    feature: features_zone
    tf: 15m
    predicate: "zone_kind IN ('demand', 'supply') AND fill_pct < 0.8"
    required: true
    weight: 9
    lookbackBars: 240

  - id: htf_order_block
    feature: features_order_block
    tf: 15m
    predicate: "ob_kind = features_bias.direction AND degree IN ('major', 'swing')"
    required: true
    weight: 8

  - id: htf_sweep
    feature: features_sweep
    tf: 15m
    predicate: "direction = features_bias.direction AND mitigated_at IS NULL"
    required: false
    weight: 6

  - id: htf_bos
    feature: features_structure
    tf: 15m
    predicate: "event_type = 'bos' AND direction = features_bias.direction"
    required: false
    weight: 5

  - id: pricing_momentum
    feature: features_pricing
    tf: 5m
    predicate: "features_bias.direction = 'bullish' AND position IN ('premium', 'equilibrium') OR
      features_bias.direction = 'bearish' AND position IN ('discount', 'equilibrium')"
    required: false
    weight: 4

entry:
  - id: ltf_ifvg
    feature: features_ifvg
    tf: 5m
    predicate: "direction = features_bias.direction"
    required: true
    weight: 10

  - id: ltf_structure
    feature: features_structure
    tf: 5m
    predicate: "event_type IN ('bos', 'mss') AND direction = features_bias.direction"
    required: false
    weight: 6

entryConfig:
  type: market
  zonePips: null

risk:
  sl: "atr(5m) * 1.5"
  tp: "sl * 2.0"
  minRR: 2.0
  timeoutBars: 120
  maxFillBars: 30

gates:
  - id: session_gate
    name: session
    params:
      allowed: [ LONDON, OVERLAP, NY ]

  - id: spread_gate
    name: spread
    params:
      maxSpreadPips: 5.0

  - id: volatility_gate
    name: volatility
    params:
      maxAtrPercentile: 0.95
      maxAtr5Pips: 30.0

  - id: portfolio_heat
    name: portfolioHeat
    params:
      maxConcurrentPerSymbol: 1
      maxConcurrentTotal: 3

  - id: rate_limit
    name: rateLimit
    params:
      maxSignalsPerHour: 2
      maxSignalsPerDay: 5

live:
  mode: paper
  lotSize: 0.01
  riskPerTradePct: 1.0
  accountBalance: 10000
  accountCurrency: USD
  signalTtlMinutes: 15
  maxSpreadPips: 5.0
  maxSlippagePoints: 30
  maxPositionsPerSymbol: 1
  maxPositionsTotal: 3
  cooldownMinutes: 30
  structureFreshnessMinutes: 30
