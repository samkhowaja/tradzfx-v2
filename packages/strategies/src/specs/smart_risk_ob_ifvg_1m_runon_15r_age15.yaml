id: smart_risk_ob_ifvg_1m_runon_15r_age15
familyId: smart_risk_ob_ifvg_1m
active: false
name: Smart Risk Scalp 1 — OB + iFVG (1.5R floor, age<=15)
version: 1.0.1
description: >
  Primary live candidate. Variant of strategy 1 that targets the nearest opposing swing pivot with a 1.5R floor,
  includes a daily-loss circuit breaker, and avoids the noisy first London hour.
overrides:
  filters:
    timeWindows:
      - utcStart: 09:00
        utcEnd: 11:30
      - utcStart: 13:30
        utcEnd: 16:30
  entry:
    - id: ltf_ifvg
      feature: features_ifvg
      tf: 5m
      predicate: direction = features_bias.direction AND fill_pct >= 0.5 AND is_fresh = true AND age_bars <= 15
      required: true
      weight: 10
    - id: ltf_structure
      feature: features_structure
      tf: 5m
      predicate: event_type IN ('bos', 'mss', 'choch') AND direction = features_bias.direction
      required: false
      weight: 5
  risk:
    tp: nearest_profit_pivot
    minRR: 1.5
    timeoutBars: 240
    tpOffsetPips: 0
  gates:
    - id: session_gate
      name: session
      params:
        allowed:
          - LONDON
          - OVERLAP
          - NY
    - id: spread_gate
      name: spread
      params:
        maxSpreadPips: 5
    - id: volatility_gate
      name: volatility
      params:
        maxAtr5Pips: 3
    - id: daily_loss
      name: dailyLoss
      params:
        maxLossesPerDay: 3
    - id: portfolio_heat
      name: portfolioHeat
      params:
        maxConcurrentPerSymbol: 1
        maxConcurrentTotal: 3
