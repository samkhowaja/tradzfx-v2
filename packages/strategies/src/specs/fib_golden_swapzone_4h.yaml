id: fib_golden_swapzone_4h
familyId: fib_golden
setupFamily: trend_pullback
active: false
name: "Fibonacci Golden Zone + Swap Zone"
version: "1.0.0"
description: >
  4H strategy based on Fibonacci golden zone (50-61.8% retracement) with swap zone
  confluence. Uses 5-period fractal swing points for Fibonacci drawing (proxied by
  features_pricing fib_position). Requires price in golden zone, a fresh demand/supply
  zone (resistance-becomes-support or support-becomes-resistance) at the same level,
  and an engulfing bar entry. SL beyond golden zone extreme, TP at next swing level
  (proxied by 3R fixed).

filters:
  symbols:
    - EURUSD
    - GBPUSD
    - XAUUSD
  sessions:
    - LONDON
    - OVERLAP
    - NY

setup:
  - id: bias
    feature: features_bias
    tf: 4h
    predicate: "direction != 'neutral'"
    required: true
    weight: 8

  - id: golden_zone
    feature: features_pricing
    tf: 4h
    # fib_position '500_618' = 50-61.8% retracement (the golden zone from the video).
    # in_ote confirms price inside the optimal trade entry band.
    predicate: "fib_position IN ('500_618', '618_786') AND in_ote = true AND position IS NOT NULL"
    required: true
    weight: 10

  - id: swap_zone
    feature: features_zone
    tf: 4h
    # Fresh demand/supply zones acting as swap points (resistance-to-support or
    # support-to-resistance). Quality filter ensures only meaningful zones.
    predicate: "zone_kind IN ('demand', 'supply') AND is_fresh = true AND quality_score > 0.1"
    required: true
    weight: 7
    groupBy:
      - zone_kind
    lookbackBars: 24

entry:
  - id: engulfing
    feature: features_candle_pattern
    tf: 4h
    # Engulfing bar at the golden zone confirms the reversal.
    pattern_name: engulfing
    predicate: "pattern_name IN ('engulfing_bull', 'engulfing_bear') AND direction = features_bias.direction AND confidence >= 0.6"
    required: true
    weight: 10
    lookbackBars: 6

entryConfig:
  type: market
  zonePips: null

signalSource: zone

risk:
  sl: "atr(4h) * 1.5"
  tp: "sl * 3.0"
  minRR: 3.0
  timeoutBars: 24
  maxFillBars: 6
  minSlDistancePips: 5.0

gates:
  - id: session_gate
    name: session
    params:
      allowed:
        - LONDON
        - OVERLAP
        - NY

  - id: spread_gate
    name: spread
    params:
      maxSpreadPips: 3.0

  - id: volatility_gate
    name: volatility
    params:
      maxAtr5Pips: 65

  - id: direction_alignment_gate
    name: directionAlignment
    params:
      enabled: true
      timeframes: ["1d", "4h", "1h"]
      require: all
      allowNeutral: true

  - id: portfolio_heat
    name: portfolioHeat
    params:
      maxConcurrentPerSymbol: 1
      maxConcurrentTotal: 3

  - id: rate_limit
    name: rateLimit
    params:
      maxSignalsPerHour: 1
      maxSignalsPerDay: 3

  - id: daily_loss
    name: dailyLoss
    params:
      maxLossesPerDay: 2

live:
  mode: paper
  lotSize: 0.01
  riskPerTradePct: 1.0
  accountBalance: 10000
  accountCurrency: USD
  signalTtlMinutes: 60
  maxSpreadPips: 3.0
  maxSlippagePoints: 20
  entryZonePips: null
  maxPositionsPerSymbol: 1
  maxPositionsTotal: 3
  cooldownMinutes: 240
