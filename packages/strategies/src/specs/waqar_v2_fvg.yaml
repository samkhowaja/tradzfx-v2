id: waqar_v2_fvg
active: true
name: "Waqar Asim Scalp V2 — FVG Context"
version: "2.1.0"
description: >
  Variant that allows Fair Value Gaps to serve as the HTF context and retest zone.
  Useful on pairs where the latest 1h/15m zone row is frequently an FVG rather than
  a classical demand/supply zone.

filters:
  symbols: [EURUSD, GBPUSD, AUDUSD, NZDUSD, USDCAD, USDCHF, USDJPY, XAUUSD]
  sessions: [LONDON, OVERLAP]

setup:
  - id: htf_zone
    feature: features_zone
    tf: 1h
    predicate: "zone_kind IN ('demand', 'supply', 'fvg')"
    required: true
    weight: 8

  - id: trend_bias
    feature: features_bias
    tf: 15m
    predicate: "direction != 'neutral'"
    required: true
    weight: 8

  - id: directional_zone
    feature: features_pricing
    tf: 15m
    predicate: |
      (features_bias.direction = 'bullish' AND position IN ('discount', 'deep_discount', 'equilibrium'))
      OR
      (features_bias.direction = 'bearish' AND position IN ('premium', 'deep_premium', 'equilibrium'))
    required: true
    weight: 8

entry:
  - id: structure_break
    feature: features_structure
    tf: 1m
    predicate: "event_type IN ('bos', 'mss') AND direction = features_bias.direction"
    required: true
    weight: 10

  - id: zone_retest
    feature: features_zone
    tf: 1m
    predicate: "zone_kind IN ('demand', 'supply', 'fvg') AND fill_pct < 0.8 AND tapped = false"
    required: false
    weight: 5

  - id: displacement_confirm
    feature: features_displacement
    tf: 1m
    predicate: "grade IN ('MEDIUM', 'HIGH')"
    required: false
    weight: 3

risk:
  sl: "atr(1m) * 1.2"
  tp: "sl * 3.0"
  minRR: 3.0
  timeoutBars: 180
  maxFillBars: 45

gates:
  - id: volatility_gate
    name: volatility
    params:
      maxAtr5: 2.0

  - id: spread_gate
    name: spread
    params:
      maxSpreadPips: 3.0

  - id: portfolio_heat
    name: portfolioHeat
    params:
      maxConcurrentPerSymbol: 2
      maxConcurrentTotal: 6

  - id: session_gate
    name: session
    params:
      allowed: [LONDON, OVERLAP]

live:
  mode: paper
  lotSize: 0.01
  riskPerTradePct: 1.0
  accountBalance: 10000
  accountCurrency: USD
  signalTtlMinutes: 15
  maxSpreadPips: 3.0
  maxSlippagePoints: 20
  entryZonePips: null
  maxPositionsPerSymbol: 1
  maxPositionsTotal: 6
  cooldownMinutes: 30
  structureFreshnessMinutes: 120

notes:
  - "Accepts FVG as HTF context and retest zone"
  - "Pricing alignment loosened to equilibrium"
